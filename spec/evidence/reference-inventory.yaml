rules:
  - This inventory is descriptive and public-safe; it contains no raw media, UI dump, or verbatim reference copy.
  - Candidate means eligible for a human scope decision, not a production requirement.
  - No candidate may be promoted to FR, US, AC, engine demand, or backlog before human Gate 1 acceptance.
  - Low-confidence observations remain claims or open questions even when their route is in a scope candidate.
  - Gate 1 evaluates semantic and behavioral inventory; visual completeness is deferred to per-surface Visual Fit Gates.
  - Preserved legacy screenshots with invalid PNG encoding are unusable for visual claims but do not invalidate trace-backed behavioral evidence.

