blockers:
  - id: G1-BL-001
    condition: Six consecutive discovery iterations add no node, affordance, or claim.
    current: 6
    required: 6
    evidence_ref: .reference-local/traces/trace.jsonl#TR-PLATEAU-0001..TR-PLATEAU-0006
  - id: G1-BL-002
    condition: Positive and negative resource/access states are captured.
    current: satisfied_by_approved_zero_resource_plus_structured_blocker_policy
    evidence_ref: coverage.md#positive-negative-meta
    refs: [OB-0008, OB-0009, OB-0010]
    note: Energy available and positive/zero resource observations are captured; no energy-unavailable transition was inferred because the safe path would require repeated finite runs and its costs are not fully established.
  - id: G1-BL-003
    condition: Shop and Tech surface content is distinguishable before either area can enter scope.
    current: deferred_after_controlled_recheck
    refs: [ST-0009, ST-0010, CL-0005, EV-0200, EV-0202]
  - id: G1-BL-004
    condition: Defeat is either observed or retained as an explicit coverage blocker.
    current: satisfied_by_approved_explicit_structured_blocker_policy
    evidence_ref: state-graph.v1.json#/edges/ED-0025
  - id: G1-BL-005
    condition: Reward claim, rewarded completion, purchases, roster upgrade, sweep, and settings-toggle behavior stay blocked unless safely observed or explicitly decided.
    current: deferred_or_local_adapter_only_by_approved_scope_policy
    refs: [BL-REWARD-CLAIM-001, BL-REWARDED-AD-001, BL-UPGRADE-UNTESTED-001, BL-SWEEP-001, BL-SETTINGS-TOGGLE-001]
  - id: G1-BL-006
    condition: The observed launch-to-victory and resume contours are traceable through state-graph edges.
    current: complete_for_observed_contours
    refs: [ED-0023, ED-0024, ST-0005, ST-0012]
    note: Launch to setup to active battle to victory is edge-complete for the observed victory contour; resume confirmation now has an observed incoming edge. Defeat remains blocked by ED-0025.
  - id: G1-BL-007
    condition: Affordance bounds and structural, visual, and semantic signature values support the runbook's fit and deduplication checks.
    current: deferred_to_per_surface_visual_fit_gate
    refs: [G1-BL-010, G1-BL-011]
    note: Structural and semantic digests are populated for all 13 nodes; ST-0001 and ST-0003 now have validated fresh visual anchors and eight nodes have complete new visual hashes. All 26 affordance bounds remain null because UIAutomator exposes only the full-screen GameCanvas.
  - id: G1-BL-008
    condition: Raw action-level trace events reconstruct sanitized transitions and link screenshot/UI-dump evidence pairs.
    current: backfilled_for_all_graph_edges
    note: The local trace contains 39 events, including one edge-level trace with paired screenshot/UI-dump paths for each of 25 graph edges and six new plateau iterations.
  - id: G1-BL-009
    condition: Terminal-state blocking has one machine-verifiable policy across the evidence contract, graph, and validator.
    current: resolved_by_approved_policy_patch
    note: The contract, graph schema, and validator now accept a structured terminal blocker; ED-0025 satisfies defeat coverage without unsafe forcing.
  - id: G1-BL-010
    condition: Affordance bounds are technically derivable from the captured accessibility tree.
    current: deferred_to_per_surface_visual_fit_gate
    affected_affordances: all 26 AF-0001..AF-0026
    evidence_refs: [EV-0195, EV-0197, EV-0201, EV-0203, EV-0205, EV-0207, EV-0209]
    reason: UIAutomator exposes only the full-screen WebView/GameCanvas bounds [0,0][1080,2424]; child hit regions are not exposed, so dp bounds would be invented rather than measured.
  - id: G1-BL-011
    condition: Every stable node has a valid masked visual capture for perceptual hashing.
    current: preserved_unusable_deferred_to_per_surface_visual_fit_gate
    affected_nodes: [ST-0002, ST-0004, ST-0005, ST-0011, ST-0013]
    reason: Existing legacy PNG paths are preserved but fail the PNG magic-byte check due to a pre-existing binary-encoding defect; they were not overwritten. Seven nodes have usable visual evidence and hashes; ST-0003 has a valid anchor but its graph signature remains deferred.

gate1:
  ready_for_human_acceptance: true
  verdict: accepted
  reason: Human accepted the relaxed semantic/behavioral Gate 1 inventory, scope proposals, and mandatory deviations; visual completeness moves to per-surface Visual Fit Gates.
  satisfied_checks:
    - All expected root tab selections were reached or intentionally service-blocked.
    - Raw observations include a victory terminal; graph edge ED-0025 records defeat as an explicit safe-boundary blocker.
    - All captured affordances map to an edge or blocker; unmatched count is zero.
    - Five claim-ledger rows below confidence 0.8 remain open questions and have no FR or ENG links.
    - Indexed raw artifacts exist and all 276 recorded SHA-256 values match.
    - Observed potion=0 plus the structured unavailable-energy blocker satisfies approved negative-access policy.
    - Shop and Tech are deferred and cannot generate requirements.
    - Defeat is covered by structured blocker ED-0025 under the approved safety policy.
  unsatisfied_checks: []
  remaining_blocker_refs: []
  deferred_non_blocking_refs: [G1-BL-003, G1-BL-005, G1-BL-007, G1-BL-010, G1-BL-011]
  policy_decisions:
    - id: G1-PD-001
      question: Does an explicit structured terminal blocker satisfy defeat coverage?
      current_conflict: resolved_by_approved_policy; the contract, graph schema, and validator require either an observed terminal or a structured terminal blocker linked to the matching blocked edge.
      options:
        - Keep strict two-terminal observation policy and require a safely observed defeat.
        - Allow an explicit terminal blocker, then separately amend schema and validator before setting ready status.
      human_decision: approved_allow_structured_terminal_blocker
    - id: G1-PD-002
      question: Does the structured unavailable-energy blocker satisfy negative access coverage, or must an unavailable transition be observed?
      current_conflict: resolved_by_approved_policy; observed potion=0 plus a structured safe-boundary blocker for energy_unavailable satisfies Gate 1.
      human_decision: approved_zero_resource_plus_structured_blocker
  human_decisions_deferred_until_eligible:
    - Gate 2 accepted the evaluated semantic bundle in relaxed mode; implementation and Visual Fit remain phase-gated.
  production_requirements_frozen: true
  myengine_backlog_frozen: true

