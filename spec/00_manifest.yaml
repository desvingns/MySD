notes:
  - Only human-locked constraints are normative before Gate 1.
  - Reference mechanic candidates remain outside FR/US/AC until observed.
  - The completed crawl inventory, scope proposals, DEV-001 through DEV-009, and the semantic bundle were accepted under relaxed Gate 1/Gate 2 policy; implementation and the MyEngine backlog bridge remain separately phase-gated.
  - The independent Gate 1 recheck found 276 indexed artifacts with zero missing files or SHA-256 mismatches.
  - Approved policy treats structured terminal and negative-access blockers as sufficient and moves visual completeness to per-surface Visual Fit Gates.
  - On 2026-09-16 the human explicitly authorized one integrated full-product implementation batch; this promotes INV-004 and INV-005 and treats all otherwise-unobserved mechanics, content, copy, visuals, and balance as original MySD decisions rather than reference observations.
